services:
  db:
    image: postgres:16-alpine
    container_name: predictor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: predictor
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-predictor}
      POSTGRES_DB: predictor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: predictor-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://predictor:${DATABASE_PASSWORD:-predictor}@db:5432/predictor
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set a strong JWT_SECRET_KEY in .env — see backend/.env.example}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS_STR=${CORS_ORIGINS_STR:-http://localhost:5173,http://localhost:3000}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-The Predictor <noreply@resend.dev>}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - MAGIC_LINK_EXPIRE_MINUTES=${MAGIC_LINK_EXPIRE_MINUTES:-15}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}
      # Google Sheets sync (v2.177.0). All empty → sheets_sync is a logged no-op.
      - GOOGLE_SHEET_ID=${GOOGLE_SHEET_ID:-}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      - SHEETS_SYNC_ENABLED=${SHEETS_SYNC_ENABLED:-true}
      - FOOTBALL_DATA_TOKEN=${FOOTBALL_DATA_TOKEN:-}
      - TOURNAMENT_CONFIG_PATH=/app/config/worldcup2026.yml
      - POSTHOG_API_KEY=${POSTHOG_API_KEY:-}
      - POSTHOG_HOST=${POSTHOG_HOST:-https://eu.i.posthog.com}
      # Read-side PostHog (v2.176.0): Personal API key + project id for
      # HogQL queries powering the Site Pulse panel and per-user
      # engagement card. Empty → posthog_read._config() returns None and
      # every helper silent-fails to an empty result.
      - POSTHOG_PERSONAL_API_KEY=${POSTHOG_PERSONAL_API_KEY:-}
      - POSTHOG_PROJECT_ID=${POSTHOG_PROJECT_ID:-}
      # The Odds API key for Smart Fill — Betting Odds method (plan §9).
      # Same env var name as the frontend services historically used; now
      # consumed server-side because the cache is shared at /app/data/odds_cache.json.
      # Empty → /api/odds returns {error: 'not_configured'} and the modal
      # disables the Betting Odds radio (graceful degradation).
      - ODDS_API_KEY=${ODDS_API_KEY:-}
    volumes:
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests
      - ./backend/data:/app/data
      - ./backend/alembic:/app/alembic
      - ./config:/app/config
      # Shared cross-language golden fixtures (scoring parity tests).
      - ./shared:/app/shared:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at `npm run build`. Unset on dev → empty
        # string → Turnstile widget skips render and the Send button isn't
        # gated. In prod, set VITE_TURNSTILE_SITE_KEY in the VPS .env and
        # this passes through to the build.
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    container_name: predictor-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Server-side load functions ("/+page.server.ts") use this to reach
      # the backend across the Docker network. Browser-side requests go
      # through nginx (/api/* → backend); SvelteKit's internal fetch does
      # not, so it needs the absolute service URL.
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
      # Analytics — read at runtime via $env/dynamic/public OR substituted
      # into app.html via %sveltekit.env.PUBLIC_*%. Empty → corresponding
      # SDK init / script tag no-ops.
      # PostHog (v2.155.0): browser SDK reads PUBLIC_POSTHOG_KEY via
      # lib/analytics/index.ts. Defaults to the same phc_* value the
      # backend uses (POSTHOG_API_KEY) — Project API keys are write-only
      # and safe to expose in client bundles per PostHog's docs.
      - PUBLIC_POSTHOG_KEY=${PUBLIC_POSTHOG_KEY:-${POSTHOG_API_KEY:-}}
      - PUBLIC_POSTHOG_HOST=${PUBLIC_POSTHOG_HOST:-${POSTHOG_HOST:-https://eu.i.posthog.com}}
      # Cloudflare Web Analytics — Core Web Vitals beacon only. Loaded
      # via app.html's <script> tag.
      - PUBLIC_CF_WA_TOKEN=${PUBLIC_CF_WA_TOKEN:-}
      # The Odds API key — read server-side by /odds/+server.ts via
      # $env/dynamic/private. Empty → proxy returns { error: 'not_configured' }
      # and the modal's Betting Odds radio is disabled (graceful degradation).
      - ODDS_API_KEY=${ODDS_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  # Development-only frontend with hot reload.
  # container_name intentionally omitted so Compose auto-names per project
  # (e.g. `predictorv2-frontend-dev-1` for the main repo, `redesign-frontend-
  # dev-1` for a parallel worktree). A parallel worktree dev container needs
  # to override the host port locally (e.g. "5174:5174" + --port 5174) and
  # join the existing predictorv2_default network to reach the shared
  # backend; see docs/superpowers/panini-redesign-decisions.md for the
  # exact recipe.
  frontend-dev:
    image: node:20-alpine
    working_dir: /app
    environment:
      - NODE_ENV=development
      # See `frontend` service for rationale.
      - BACKEND_INTERNAL_URL=${BACKEND_INTERNAL_URL:-http://backend:8000}
      # Analytics env vars — see `frontend` service above. Empty on dev
      # by default so local sessions don't pollute prod metrics.
      - PUBLIC_POSTHOG_KEY=${PUBLIC_POSTHOG_KEY:-}
      - PUBLIC_POSTHOG_HOST=${PUBLIC_POSTHOG_HOST:-https://eu.i.posthog.com}
      - PUBLIC_CF_WA_TOKEN=${PUBLIC_CF_WA_TOKEN:-}
      # See `frontend` service for rationale.
      - ODDS_API_KEY=${ODDS_API_KEY:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Shared cross-language golden fixtures (scoring parity tests). The
      # parity test parent-walks from /app/src/... and finds /app/shared.
      - ./shared:/app/shared:ro
    ports:
      # Bind to 127.0.0.1 only — matches the other services. Without this,
      # Docker Desktop on Windows also exposes [::]:5173 (IPv6) which
      # accepts connections but resets them (Vite only listens on IPv4),
      # causing browsers to fail with ERR_CONNECTION_RESET when Chrome's
      # Happy Eyeballs algorithm tries ::1 first.
      - "127.0.0.1:5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - dev

  # Nginx reverse proxy (production)
  nginx:
    image: nginx:alpine
    container_name: predictor-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "80"
    depends_on:
      - backend
      - frontend
    profiles:
      - prod

  # Cloudflare Tunnel - replaces public port exposure
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: predictor-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - nginx
    profiles:
      - prod

volumes:
  postgres_data:
