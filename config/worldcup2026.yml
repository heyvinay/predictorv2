# World Cup 2026 Tournament Configuration
# This file configures the tournament structure and scoring rules.

tournament:
  name: "FIFA World Cup 2026"
  year: 2026
  teams: 48
  groups: 12
  teams_per_group: 4

# Prediction locking rules
locking:
  # Minutes before kickoff to lock predictions
  match_lock_before_kickoff: 5
  # Whether to lock entire bracket at a deadline vs individual match times
  bracket_lock_mode: "deadline"  # or "per_match"

# Scoring configuration
scoring:
  # Scoring mode for match predictions:
  # - "fixed":       Flat points for correct outcome (no rarity bonus).
  # - "hybrid":      Legacy. Base points + integer-divide rarity bonus
  #                  min(cap, total_predictors // correct_predictors).
  # - "logarithmic": Default. Base points + Shannon-surprisal rarity bonus.
  #                  R = min(cap, round(alpha * log2(1 / (2f))))
  #                  where f = correct_predictors / total_predictors and
  #                  alpha = 10/log2(15) ≈ 2.5596 so f = 1/30 hits cap 10.
  #                  Gates at f >= 0.5 (consensus picks earn no premium).
  #
  # Published rarity bonus by % of predictors who picked the actual outcome
  # (independent of pool size — scale-invariant):
  #   R = 0   when f > 43.67%   (consensus zone)
  #   R = 1   when 33.31% < f ≤ 43.67%
  #   R = 2   when 25.41% < f ≤ 33.31%
  #   R = 3   when 19.38% < f ≤ 25.41%
  #   R = 4   when 14.78% < f ≤ 19.38%
  #   R = 5   when 11.28% < f ≤ 14.78%
  #   R = 6   when  8.60% < f ≤ 11.28%
  #   R = 7   when  6.56% < f ≤  8.60%
  #   R = 8   when  5.00% < f ≤  6.56%
  #   R = 9   when  3.82% < f ≤  5.00%
  #   R = 10  when f ≤ 3.82%    (capped)
  # See docs/scoring-system.md for derivation.
  mode: "logarithmic"

  match:
    # Points for correctly predicting match outcome (1-X-2)
    correct_outcome: 5
    # Bonus points for predicting exact score
    exact_score: 10
    # Maximum rarity bonus. Anchor: alpha is chosen so f = 1/30 hits this
    # cap, so a uniquely correct call out of ~30 predictors maxes out.
    rarity_cap: 10
    # Legacy alias (read as fallback for older configs).
    hybrid_cap: 10

  advancement:
    # Points for predicting team advances from group stage
    group_advance: 10
    # Bonus for predicting correct group position (1st vs 2nd)
    group_position: 5
    # Knockout round advancement points. Source of truth: /rules page
    # (BRACKET_STAGES constant). Bumped 2026-06-01 to match the rules-page
    # values; the prior 10/15/20/40/60 scale undercut what users saw.
    #
    # ★ This list is also the WHITELIST of scored fixture stages. Fixture
    #   rows with stage values not in this list (notably 'third_place', the
    #   bronze-medal playoff between the semi-final losers — a real FIFA
    #   fixture but irrelevant to the pool) must NEVER appear in any
    #   prediction wizard, scoring path, or results UI surface. The round
    #   bucketer at frontend/src/lib/utils/resultsRounds.ts pins this rule
    #   (regression-tested in resultsRounds.test.ts).
    round_of_32: 20
    round_of_16: 30
    quarter_final: 40
    semi_final: 50
    final: 75
    winner: 100

  # Phase-specific multipliers
  # Phase 1: Pre-tournament predictions (full points)
  # Phase 2: Post-group stage predictions (reduced points)
  phase_multipliers:
    phase_1: 1.0
    phase_2: 0.7

# Bonus questions
# These are pre-tournament predictions that lock with the deadline and are
# scored when the admin enters the correct answer in /admin. Two categories:
# Group stage and Top / Flop (rendered as "Knockout Stage — Top / Flop" in
# user-facing copy; the internal `top_flop` literal is preserved across
# code, DB, and tests for backward compatibility).
#
# Each question has a stable `id` used as the foreign key in bonus_predictions
# and bonus_answers. Labels support {top_n} substitution so changing top_n
# below updates the wording everywhere automatically.
bonus:
  # Configurable: which FIFA rank cutoff defines "dark horse" / "flop". Users
  # see this number substituted into the question labels; auto-computation of
  # those questions reads `fifa_top_teams` below to decide which teams count
  # as "inside the top N".
  top_n: 10

  # Teams considered FIFA top-N at tournament start. Used by the auto-resolver
  # to decide "dark horse" (best progress among teams OUTSIDE this list) and
  # "bottlers" (earliest exit among teams INSIDE this list). Only teams that
  # are actually in the competition contribute — others are ignored.
  # Order = current FIFA rank. Refreshed 2026-06-01 against the April 2026
  # FIFA Men's World Ranking; Italy (rank 12, did not qualify for 2026 WC)
  # dropped, Morocco (rank 8) added. Every team in this list is verified
  # qualified for the 2026 tournament.
  fifa_top_teams:
    - "France"        # 1
    - "Spain"         # 2
    - "Argentina"     # 3
    - "England"       # 4
    - "Portugal"      # 5
    - "Brazil"        # 6
    - "Netherlands"   # 7
    - "Morocco"       # 8
    - "Belgium"       # 9
    - "Germany"       # 10

  # Point values per category. Flat within a category, so all group-stage
  # questions are worth the same. Tweak here without code changes.
  # `awards` is kept defensively in case awards questions are re-added; no
  # current question references it.
  points:
    group_stage: 15
    top_flop: 20
    awards: 20

  # Question definitions. `input_type` drives the wizard UI:
  #   - 'team'                 → 48-team dropdown sourced from the groups: section above
  #   - 'team_outside_top_n'   → dropdown filtered to teams NOT in fifa_top_teams
  #   - 'team_in_top_n'        → dropdown of exactly the fifa_top_teams list (intersected with allTeams)
  #   - 'player'               → free-text input (legacy; no current questions use it)
  questions:
    # ── Group stage ──────────────────────────────────────────────────
    - id: most_goals_scored_group
      category: group_stage
      label: "Goal Machine — team that scores the most goals in the group stage"
      input_type: team
    - id: most_goals_conceded_group
      category: group_stage
      label: "The Sieve — team that concedes the most goals in the group stage"
      input_type: team

    # ── Top / Flop (FIFA top_n cutoff) — rendered as "Knockout Stage — Top / Flop" in UI ──
    - id: dark_horse
      category: top_flop
      label: "Dark Horse — team outside FIFA top {top_n} that progresses furthest"
      input_type: team_outside_top_n
    - id: flop
      category: top_flop
      label: "Bottlers — team inside FIFA top {top_n} eliminated earliest, including not making it to the knockout stage."
      input_type: team_in_top_n

# Group stage configuration. Source: official FIFA 2026 World Cup Final
# Draw, held 2025-12-05 at the Kennedy Center, Washington D.C. First team
# is the seeded host or top-pot team per group.
groups:
  A: ["Mexico", "South Africa", "South Korea", "Czech Republic"]
  B: ["Canada", "Bosnia and Herzegovina", "Qatar", "Switzerland"]
  C: ["Brazil", "Morocco", "Haiti", "Scotland"]
  D: ["United States", "Paraguay", "Australia", "Turkey"]
  E: ["Germany", "Curaçao", "Ivory Coast", "Ecuador"]
  F: ["Netherlands", "Japan", "Sweden", "Tunisia"]
  G: ["Belgium", "Egypt", "Iran", "New Zealand"]
  H: ["Spain", "Cape Verde", "Saudi Arabia", "Uruguay"]
  I: ["France", "Senegal", "Iraq", "Norway"]
  J: ["Argentina", "Algeria", "Austria", "Jordan"]
  K: ["Portugal", "DR Congo", "Uzbekistan", "Colombia"]
  L: ["England", "Croatia", "Ghana", "Panama"]
