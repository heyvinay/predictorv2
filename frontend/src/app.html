<!doctype html>
<html lang="en" data-theme="premium-night">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Football prediction competition for World Cup 2026" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- Google Fonts:
		     - Bebas Neue + DM Sans → used by the bundled `light` theme.
		     - Inter + Manrope      → used by `premium-night` (Inter body,
		       Manrope display / scores). Loaded unconditionally; the
		       premium-scoped CSS layer in app.css gates them on
		       [data-theme="premium-night"]. -->

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@300..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
		<title>Predictor v2</title>
		<script>
			// Apply persisted theme synchronously to prevent FOUC.
			// Mirrors DEFAULT_THEME / THEMES in lib/stores/theme.ts.
			try {
				var t = localStorage.getItem('predictor:theme');
				if (t !== 'light' && t !== 'premium-night') t = 'premium-night';
				document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
