<!doctype html>
<html lang="en" data-theme="predictor">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Football prediction competition for World Cup 2026" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- Google Fonts: Bebas Neue (display) + DM Sans (body) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet" />
		<title>Predictor v2</title>
		<script>
			// Apply persisted theme synchronously to prevent FOUC.
			// Mirrors DEFAULT_THEME and STORAGE_KEY in lib/stores/theme.ts.
			try {
				var t = localStorage.getItem('predictor:theme');
				if (t) document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
