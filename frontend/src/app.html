<!doctype html>
<html lang="en" data-theme="hybrid">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/icons/favicon-16.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/icons/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="48x48" href="%sveltekit.assets%/icons/favicon-48.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<meta name="theme-color" content="#0B1329" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Football prediction competition for World Cup 2026" />
		<meta name="robots" content="noindex, nofollow" />
		<!-- Google Fonts — system stack carries both themes
		     (themes change colour, not voice):
		     - Manrope 700/800        → display / wordmark / scores
		     - Inter 400/500/600/700  → body, UI, captions
		     - JetBrains Mono 500     → timers, codes, monospace data
		     - Bebas Neue (regular)   → opt-in via `font-hero` for landing
		                                hero headlines only -->

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Bebas+Neue&display=swap" rel="stylesheet" />
		<title>Predictor v2</title>
		<script>
			// Apply persisted theme synchronously to prevent FOUC.
			// Themes: hybrid (default, light body + dark chrome) | premium-night (dark).
			// Removed keys (premium-day, vin-*, legacy 'light') map to their
			// tonal survivor. Keep in sync with LEGACY_MAP in $lib/stores/theme.ts.
			try {
				var t = localStorage.getItem('predictor:theme');
				var legacy = { 'light': 'hybrid', 'premium-day': 'hybrid', 'vin-light': 'hybrid', 'vin-hybrid': 'hybrid', 'vin-dark': 'premium-night' };
				if (t && legacy[t]) t = legacy[t];
				if (t !== 'hybrid' && t !== 'premium-night') t = 'hybrid';
				document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		</script>

		<!-- Analytics — two complementary tools, both cookie-less & async.
		     Umami Cloud  → behaviour (pageviews + custom events; see
		                    lib/analytics/index.ts for the wrapper).
		     Cloudflare WA → real-user Core Web Vitals (LCP/FCP/CLS/TTFB).
		     Both no-op when their env var is empty (dev default). -->
		<script
			async
			defer
			src="https://cloud.umami.is/script.js"
			data-website-id="%sveltekit.env.PUBLIC_UMAMI_WEBSITE_ID%"
		></script>
		<script
			async
			defer
			src="https://static.cloudflareinsights.com/beacon.min.js"
			data-cf-beacon='{"token": "%sveltekit.env.PUBLIC_CF_WA_TOKEN%"}'
		></script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
